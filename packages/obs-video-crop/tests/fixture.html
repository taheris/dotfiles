<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>OBS video crop smoke test</title>
<style>
  body { background: #d32f2f; color: white; font: 20px sans-serif; margin: 40px; }
  video { display: block; width: 640px; height: 360px; margin: 60px auto; }
</style>
<h1>Red webpage pixels must NOT appear in OBS</h1>
<button id="play">Play generated video</button>
<video id="video" controls muted playsinline></video>
<p>Resize, zoom, show the sidebar, and scroll before reapplying the shortcut.</p>
<script>
const canvas = document.createElement("canvas");
canvas.width = 1280;
canvas.height = 720;
const context = canvas.getContext("2d");
function draw() {
    context.fillStyle = "#1565c0";
    context.fillRect(0, 0, 1280, 720);
    context.strokeStyle = "#4cff00";
    context.lineWidth = 12;
    context.strokeRect(6, 6, 1268, 708);
    context.fillStyle = "white";
    context.font = "60px sans-serif";
    context.fillText("Only this picture belongs in OBS", 100, 330);
    context.fillText(new Date().toLocaleTimeString(), 460, 440);
}
draw();
setInterval(draw, 100);
document.querySelector("#play").onclick = async () => {
    const video = document.querySelector("#video");
    video.srcObject = canvas.captureStream(10);
    await video.play();
};
</script>
</html>
